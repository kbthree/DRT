name: Harness checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node harness/git-guard.mjs check
      - run: node harness/git-guard.mjs verify --delivery
